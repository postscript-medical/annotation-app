type Organization {
  email: String!
  level: [String!]!
  maxSpecialties: Int!
  maxUsers: Int!
  specialties: [String!]!
  stripeId: ID!
  teams: [Team!]! @relation
}

type Team {
  members: [User!]! @relation
  name: String!
  organization: Organization!
}

type User {
  email: String!
  firstName: String
  lastName: String
  netlifyId: ID!
  role: String!
  showTutorial: Boolean!
  team: Team!
}

type Query {
  getOrganizationById(stripeId: ID!): Organization!
  getUserById(netlifyId: ID!): User!
  getUserByEmail(email: String!): User!
}
