[build]
  command = "npm run build"
  # @sveltejs/adapter-netlify writes the client assets here and the server
  # function to .netlify/v1 (Netlify Frameworks API).
  publish = "build"

[build.environment]
  NODE_VERSION = "24"

# Cloudinary illustrations. NOTE: the SvelteKit function claims "/*", and
# Netlify runs path-configured functions before redirects, so this rule is
# currently shadowed on the new site. How /images/* is served is decided
# before 2.3/2.4 (see docs/migration-execution-plan.md 1.2).
[[redirects]]
  from = "/images/*"
  to = "https://res.cloudinary.com/postscript-medical/image/upload/q_auto:eco/:splat"
  status = 200
