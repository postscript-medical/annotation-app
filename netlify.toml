[build]
  command = "npm run build"
  publish = "public"
  functions = "functions"

[dev]
  command = "npm run dev"
  targetPort = 8080

[dev.environment]
  DEVELOPMENT_CONTEXT = "true"

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "interest-cohort=()"

[[redirects]]
  from = "images/*"
  to = "https://res.cloudinary.com/postscript-medical/image/upload/q_auto:eco/:splat"
  status = 200

[[redirects]]
  from = "api/*"
  to = ".netlify/functions/:splat"
  status = 200