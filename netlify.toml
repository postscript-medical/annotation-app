[build]
  command = "npm run build"
  # @sveltejs/adapter-netlify writes the client assets here and the server
  # function to .netlify/v1 (Netlify Frameworks API).
  publish = "build"

[build.environment]
  NODE_VERSION = "24"

# Cloudinary illustrations are served by the app itself (G7, 2.4): the route
# src/routes/images/[...path] proxies an allow-listed set of paths from
# Cloudinary, with CDN cache headers. (The legacy /images/* rewrite was
# shadowed by the SvelteKit function, which claims "/*", and was removed.)
