name: CI

on:
  push:
    branches: [migration-sveltekit, staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Builds and tests never talk to a hosted Supabase project or send real email.
      CI: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Removed-scope check
        run: npm run check:scope

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit -- --run

      - name: Start local Supabase
        # Migrations and supabase/seed.sql are applied on start. Mailpit stays on for auth emails.
        run: npx supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: E2E tests
        if: ${{ !(github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main')) }}
        run: npx playwright test

      - name: E2E tests with Percy
        # Visual snapshots only on PRs to staging or main.
        if: ${{ github.event_name == 'pull_request' && (github.base_ref == 'staging' || github.base_ref == 'main') }}
        run: npx percy exec -- npx playwright test
        env:
          PERCY_TOKEN: ${{ secrets.PERCY_TOKEN }}

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Stop local Supabase
        if: ${{ always() }}
        run: npx supabase stop --no-backup
